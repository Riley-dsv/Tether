name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Shared with android-integration.yml so build and emulator workloads queue.
  group: tether-ci
  cancel-in-progress: false

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Run analysis and unit/widget tests
        run: ./scripts/test.sh check

  android-build:
    name: Build Android APKs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build Android debug APK
        run: ./scripts/test.sh build

      - name: Upload debug APK
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build integration test APK
        run: ./scripts/test.sh build-integration

      - name: Upload integration test APK
        id: upload-integration
        uses: actions/upload-artifact@v4
        with:
          name: integration-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Publish artifact links
        env:
          APP_ARTIFACT_URL: ${{ steps.upload-app.outputs.artifact-url }}
          INTEGRATION_ARTIFACT_URL: ${{ steps.upload-integration.outputs.artifact-url }}
        run: |
          echo '## Android artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo "- [Installable debug APK]($APP_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Integration test APK]($INTEGRATION_ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
