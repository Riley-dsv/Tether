name: Android Integration

on:
  workflow_run:
    workflows: [CI Build]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  # Shared with ci.yml: this workflow waits for all build work to finish.
  group: tether-ci
  cancel-in-progress: false

jobs:
  android-integration:
    name: Android integration test
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Download integration APK from CI Build
        uses: actions/download-artifact@v4
        with:
          name: integration-debug
          path: artifacts/integration-debug
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Report tested build
        env:
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "Testing artifact from $SOURCE_RUN_URL at $SOURCE_SHA"

      - name: Run integration suite on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_3a
          disable-animations: true
          script: ./scripts/test.sh integration-binary emulator-5554 artifacts/integration-debug/app-debug.apk
